# NovaCloudEdu Nginx production config
# Place this file under /etc/nginx/conf.d/novacloudedu.conf

# WebSocket upgrade support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream novacloudedu_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream novacloudedu_rtc {
    server 127.0.0.1:8300;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Allow large file uploads
    client_max_body_size 500M;

    # Frontend dist directory generated by Vite build
    root /var/www/novacloudedu/web/dist;
    index index.html;

    access_log /var/log/nginx/novacloudedu.access.log;
    error_log /var/log/nginx/novacloudedu.error.log warn;

    # Security headers (safe defaults)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # API reverse proxy
    # SSE endpoints: disable buffering/cache to stream events in real time
    location ~* ^/api/.*/(stream|sse)(/|$) {
        # Normalize accidental duplicated prefix for SSE endpoints too:
        # /api/api/* -> /api/*
        rewrite ^/api/api$ /api break;
        rewrite ^/api/api/(.*)$ /api/$1 break;

        proxy_pass http://novacloudedu_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cache-Control "no-cache";

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_cache off;
        # Prevent mismatched length metadata on long-lived streams.
        proxy_hide_header Content-Length;
        gzip off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache" always;
        add_header Content-Type "text/event-stream; charset=utf-8" always;

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Frontend may use VITE_API_BASE_URL=/api and connect to /api/ws
    # Rewrite to backend's real STOMP endpoint /ws and keep WS upgrade headers
    location = /api/ws {
        rewrite ^/api/ws$ /ws break;

        proxy_pass http://novacloudedu_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 3600s;
    }

    location /api/ws/ {
        rewrite ^/api/ws/(.*)$ /ws/$1 break;

        proxy_pass http://novacloudedu_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 3600s;
    }

    location /api/ {
        # Normalize accidental duplicated prefix: /api/api/* -> /api/*
        rewrite ^/api/api$ /api break;
        rewrite ^/api/api/(.*)$ /api/$1 break;

        proxy_pass http://novacloudedu_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # STOMP/WebSocket endpoint used by frontend
    location /ws {
        proxy_pass http://novacloudedu_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 3600s;
    }

    # RTC signaling service used by web audio/video calls
    # Frontend default: ws(s)://<current-host>/rtc/ws?token=...
    location /rtc/ {
        proxy_pass http://novacloudedu_rtc/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 3600s;
    }

    # Static assets cache policy
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|ttf|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
