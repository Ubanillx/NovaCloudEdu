listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled     on;
    listen      8080;
}

http_api {
    enabled     on;
    listen      1985;
}

vhost __defaultVhost__ {
    # HTTP-FLV 低延迟分发
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    # HLS 分发（兜底）
    hls {
        enabled     on;
        hls_path    ./objs/nginx/html;
        hls_fragment 3;
        hls_window  9;
    }
    # 回调鉴权 - 推流/观看时通知 Java 后端
    http_hooks {
        enabled         on;
        on_publish      http://backend:8080/api/internal/srs/on_publish;
        on_unpublish    http://backend:8080/api/internal/srs/on_unpublish;
        on_play         http://backend:8080/api/internal/srs/on_play;
        on_stop         http://backend:8080/api/internal/srs/on_stop;
    }
}
