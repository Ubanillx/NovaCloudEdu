# NovaCloudEdu 基础设施编排
# 使用前请先复制 .env.example 为 .env 并修改密码

services:
  # ========== 基础设施服务 ==========

  # PostgreSQL - 主数据库（含 vector 扩展）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nova-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-novacloudedu}
      - POSTGRES_USER=${DB_USERNAME:-nova}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/sql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nova} -d ${DB_NAME:-novacloudedu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nova-network
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - log_statement=all
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M

  # Redis - 缓存和会话
  redis:
    image: redis:7-alpine
    container_name: nova-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      sh -c 'redis-server
      --appendonly yes
      $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

  # Elasticsearch - 搜索引擎（含 IK 中文分词器）
  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: nova-elasticsearch
    ports:
      - "${ES_PORT:-9200}:9200"
      - "${ES_TRANSPORT_PORT:-9300}:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nova-network

  # Neo4j - 图数据库
  neo4j:
    image: neo4j:5-community
    container_name: nova-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/neo4j_password}
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - nova-network

  # ========== 文档处理服务 ==========

  # Gotenberg - PDF 转换服务
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: nova-gotenberg
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nova-network
    deploy:
      resources:
        limits:
          cpus: '${GOTENBERG_CPU_LIMIT:-1}'
          memory: ${GOTENBERG_MEM_LIMIT:-1G}
        reservations:
          cpus: '${GOTENBERG_CPU_RESERVE:-0.5}'
          memory: ${GOTENBERG_MEM_RESERVE:-512M}

  # OnlyOffice - 文档编辑服务
  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: nova-onlyoffice
    ports:
      - "${ONLYOFFICE_PORT:-9980}:80"
    environment:
      - JWT_ENABLED=${ONLYOFFICE_JWT_ENABLED:-true}
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-changeme_onlyoffice_secret_1234567}
      - JWT_HEADER=Authorization
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nova-network
    deploy:
      resources:
        limits:
          cpus: '${ONLYOFFICE_CPU_LIMIT:-2}'
          memory: ${ONLYOFFICE_MEM_LIMIT:-2G}
        reservations:
          cpus: '${ONLYOFFICE_CPU_RESERVE:-0.5}'
          memory: ${ONLYOFFICE_MEM_RESERVE:-1G}

  # ========== 应用服务 ==========

  # Backend - Java 后端服务
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nova-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # ---- Spring Profile ----
      - SPRING_PROFILES_ACTIVE=docker
      # ---- 基础设施连接（docker profile 已设默认容器名，此处仅传密码） ----
      - DB_NAME=${DB_NAME:-novacloudedu}
      - DB_USERNAME=${DB_USERNAME:-nova}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_password}
      # ---- JWT ----
      - JWT_SECRET=${JWT_SECRET:-NovaCloudEduSecretKey123456789012345678901234567890}
      # ---- 邮件 ----
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - ADMIN_EMAIL_ENABLED=${ADMIN_EMAIL_ENABLED:-true}
      - ADMIN_EMAIL_RECIPIENTS=${ADMIN_EMAIL_RECIPIENTS:-}
      # ---- SMS ----
      - SMS_URL=${SMS_URL:-}
      - SMS_TOKEN=${SMS_TOKEN:-}
      # ---- 阿里云 OSS ----
      - ALIYUN_OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
      - ALIYUN_OSS_ACCESS_KEY_ID=${ALIYUN_OSS_ACCESS_KEY_ID:-}
      - ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      - ALIYUN_OSS_BUCKET_NAME=${ALIYUN_OSS_BUCKET_NAME:-}
      - ALIYUN_OSS_DOMAIN=${ALIYUN_OSS_DOMAIN:-}
      # ---- 阿里云 NLS ----
      - ALIYUN_NLS_ACCESS_KEY_ID=${ALIYUN_NLS_ACCESS_KEY_ID:-}
      - ALIYUN_NLS_ACCESS_KEY_SECRET=${ALIYUN_NLS_ACCESS_KEY_SECRET:-}
      - ALIYUN_NLS_APP_KEY=${ALIYUN_NLS_APP_KEY:-}
      # ---- AI API Keys（直接透传，application.yml 通过 ${} 读取） ----
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_ENABLED=${DEEPSEEK_ENABLED:-false}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_ENABLED=${MOONSHOT_ENABLED:-false}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - ZHIPU_ENABLED=${ZHIPU_ENABLED:-false}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - SILICONFLOW_ENABLED=${SILICONFLOW_ENABLED:-false}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      # ---- 百度 OCR ----
      - BAIDU_OCR_APP_ID=${BAIDU_OCR_APP_ID:-}
      - BAIDU_OCR_API_KEY=${BAIDU_OCR_API_KEY:-}
      - BAIDU_OCR_SECRET_KEY=${BAIDU_OCR_SECRET_KEY:-}
      # ---- 书籍加密 ----
      - BOOK_ENCRYPTION_ENABLED=${BOOK_ENCRYPTION_ENABLED:-false}
      - BOOK_ENCRYPTION_KEY=${BOOK_ENCRYPTION_KEY:-NovaCloudEduBookKey1}
      # ---- Tavily / PPT Agent ----
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PPT_AGENT_CONCURRENCY=${PPT_AGENT_CONCURRENCY:-3}
      - PPT_AGENT_QUALITY_THRESHOLD=${PPT_AGENT_QUALITY_THRESHOLD:-65}
      - PPT_AGENT_IMAGE_SEARCH_ENABLED=${PPT_AGENT_IMAGE_SEARCH_ENABLED:-false}
      # ---- OnlyOffice ----
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-changeme_onlyoffice_secret_1234567}
      # ---- 代码沙箱 ----
      - CODE_SANDBOX_DOCKER_ENABLED=true
      # ---- SRS ----
      - SRS_HTTP_BASE=http://localhost:${SRS_HTTP_PORT:-8085}
      # ---- 服务器 ----
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://localhost:8080}
    volumes:
      # Docker socket - 允许容器内创建其他容器
      # macOS Docker Desktop 使用特殊路径，需要读写权限
      - /Users/longxinliu/.docker/run/docker.sock:/var/run/docker.sock:rw
      # Python 代码沙箱缓存和临时目录
      - python-sandbox-venvs:/opt/novacloudedu/venvs
      - python-sandbox-tmp:/tmp/novacloudedu-sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nova-network
    # 使用 root 用户运行以访问 Docker socket
    user: root

  # PPT Service - Python PPT 生成服务
  ppt-service:
    build:
      context: ../ppt-service
      dockerfile: Dockerfile
    container_name: nova-ppt-service
    ports:
      - "${PPT_SERVICE_PORT:-8100}:8100"
    environment:
      - PORT=8100
      - GOTENBERG_URL=http://gotenberg:3000
      # 阿里云 OSS — Python oss_client.py 读取 OSS_* 变量名
      - OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
      - OSS_ACCESS_KEY_ID=${ALIYUN_OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET_NAME=${ALIYUN_OSS_BUCKET_NAME:-novacloudedu}
      - OSS_DOMAIN=${ALIYUN_OSS_DOMAIN:-}
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nova-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Typst Service - 试卷排版编译服务
  typst-service:
    build:
      context: ../typst-service
      dockerfile: Dockerfile
    container_name: nova-typst-service
    ports:
      - "${TYPST_SERVICE_PORT:-8200}:8200"
    environment:
      - PORT=8200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nova-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== 实时音视频服务 ==========

  # Go RTC 通话信令服务
  rtc-service:
    build:
      context: ../rtc-service
      dockerfile: Dockerfile
    container_name: nova-rtc-service
    ports:
      - "${RTC_WS_PORT:-8300}:8300"
    environment:
      - JWT_SECRET=${JWT_SECRET:-NovaCloudEduSecretKey123456789012345678901234567890}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JAVA_BACKEND_URL=http://host.docker.internal:8080
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - TURN_URL=turn:coturn:3478
      - TURN_USER=${TURN_USER:-nova}
      - TURN_PASSWORD=${TURN_PASSWORD:-changeme}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nova-network

  # SRS 直播媒体服务器
  srs:
    image: ossrs/srs:5
    container_name: nova-srs
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_PORT:-8085}:8080"
      - "${SRS_API_PORT:-1985}:1985"
    volumes:
      - ../rtc-service/srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
      - srs_data:/usr/local/srs/objs
    restart: unless-stopped
    networks:
      - nova-network

  # coturn TURN/STUN 中继服务器
  coturn:
    image: coturn/coturn:latest
    container_name: nova-coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "49152-49200:49152-49200/udp"
    command: >
      -n --log-file=stdout
      --min-port=49152 --max-port=49200
      --realm=${TURN_REALM:-novacloudedu.com}
      --user=${TURN_USER:-nova}:${TURN_PASSWORD:-changeme}
      --lt-cred-mech
    restart: unless-stopped
    networks:
      - nova-network

  # LiveKit SFU（P2P 降级用）
  livekit:
    image: livekit/livekit-server:latest
    container_name: nova-livekit
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP:-7881}:7881"
      - "7882:7882/udp"
    volumes:
      - ../rtc-service/livekit/livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    networks:
      - nova-network

networks:
  nova-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  es_data:
  neo4j_data:
  onlyoffice_data:
  onlyoffice_log:
  # Python 代码沙箱缓存和临时目录
  python-sandbox-venvs:
  python-sandbox-tmp:
  # SRS 直播数据
  srs_data:
