services:
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ppt-service:
    build: ../ppt-service
    container_name: ppt-service
    ports:
      - "8100:8100"
    env_file:
      - ../ppt-service/.env
    environment:
      - PORT=8100
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
