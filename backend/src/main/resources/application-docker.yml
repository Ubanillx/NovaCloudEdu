spring:
  data:
    redis:
      host: redis
      port: 6379
      password: ${SPRING_REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:novacloudedu}?stringtype=unspecified
    username: ${POSTGRES_USER:nova}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD}
  docker:
    compose:
      enabled: false

# AI 配置
ai:
  dashscope:
    api-key: ${AI_DASHSCOPE_APIKEY:}
    llm:
      model-name: qwen-max
      vision-model-name: qwen-vl-max
      temperature: 0.7
      max-tokens: 2000
      top-p: 0.8
      enable-search: false
    embedding:
      model-name: ${AI_DASHSCOPE_EMBEDDING_MODELNAME:text-embedding-v2}
      dimension: 1536
      text-type: document
    rerank:
      model-name: ${DASHSCOPE_RERANK_MODEL:gte-rerank}
      enabled: true

  # 对话记忆配置
  conversation:
    max-history: 10
    context-window: 4000
    window-size: 20
    summarize-threshold: 30

  # 多模型路由配置
  chat-models:
    default-model: dashscope/qwen-max
    default-vision-model: dashscope/qwen-vl-max
    providers:
      dashscope:
        enabled: true
        api-key: ${AI_DASHSCOPE_APIKEY:}
      openai:
        enabled: false
        api-key: ${OPENAI_API_KEY:}
      deepseek:
        enabled: false
        api-key: ${DEEPSEEK_API_KEY:}
      moonshot:
        enabled: false
        api-key: ${MOONSHOT_API_KEY:}
      zhipu:
        enabled: false
        api-key: ${ZHIPU_API_KEY:}
      siliconflow:
        enabled: false
        api-key: ${SILICONFLOW_API_KEY:}

  # 文生图模型配置
  image-models:
    enabled: true
    default-model: dashscope/wan2.6-t2i
    upload-to-oss: true
    providers:
      dashscope:
        enabled: true
        api-key: ${AI_DASHSCOPE_APIKEY:}

  # 文生视频模型配置
  video-models:
    enabled: true
    default-model: dashscope/wan2.6-t2v
    upload-to-oss: true
    providers:
      dashscope:
        enabled: true
        api-key: ${AI_DASHSCOPE_APIKEY:}

  # RAG 配置
  rag:
    enabled: true
    top-k: 5
    similarity-threshold: 0.7
    chunk-size: 500
    chunk-overlap: 50
    max-context-length: 3000

# SMS 配置
sms:
  url: ${SMS_URL:}
  query-url: https://push.spug.cc/request/query
  token: ${SMS_TOKEN:}
  app-name: 智云星课
  expire-minutes: 5

# 阿里云配置
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESSKEYID:}
    access-key-secret: ${ALIYUN_OSS_ACCESSKEYSECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKETNAME:}
    domain: ${ALIYUN_OSS_DOMAIN:}
  nls:
    access-key-id: ${ALIYUN_NLS_ACCESSKEYID:}
    access-key-secret: ${ALIYUN_NLS_ACCESSKEYSECRET:}
    app-key: ${ALIYUN_NLS_APPKEY:}

# 书籍加密配置
book:
  content:
    encryption:
      enabled: ${BOOK_CONTENT_ENCRYPTION_ENABLED:false}
      secret-key: ${BOOK_CONTENT_ENCRYPTION_SECRETKEY:NovaCloudEduBookKey1}

# PPT 服务配置
ppt-service:
  url: ${PPT_SERVICE_URL:http://ppt-service:8100}

# OnlyOffice 配置
onlyoffice:
  document-server-url: ${ONLYOFFICE_URL:http://onlyoffice:80}
  callback-url: ${ONLYOFFICE_CALLBACK_URL:http://localhost:8080/api/onlyoffice/callback}

# Elasticsearch 配置
spring.elasticsearch.uris: http://elasticsearch:9200
