spring:
  application:
    name: backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
  # 邮件 SMTP 配置
  mail:
    host: ${MAIL_HOST:smtp.exmail.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.required: true
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
      mail.smtp.socketFactory.port: 465
      mail.smtp.socketFactory.fallback: false
      mail.smtp.timeout: 5000
      mail.smtp.connectiontimeout: 5000

# 管理员邮件通知配置
admin-email:
  enabled: ${ADMIN_EMAIL_ENABLED:true}
  recipients: ${ADMIN_EMAIL_RECIPIENTS:email@ubanillx.cn}
  platform-name: 智云星课
# JWT 配置
jwt:
  secret: ${JWT_SECRET:NovaCloudEduSecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-handlers-package: com.novacloudedu.backend.infrastructure.persistence.handler
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# 百度OCR配置（AIP SDK，替代 PaddleOCR Docker）
baidu:
  ocr:
    app-id: ${BAIDU_OCR_APP_ID:}
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}
    api-type: ${BAIDU_OCR_API_TYPE:accurate}  # accurate / general / handwriting

# 代码执行沙箱配置
workflow:
  code-sandbox:
    docker-enabled: ${CODE_SANDBOX_DOCKER_ENABLED:true}
    docker-host: ${CODE_SANDBOX_DOCKER_HOST:unix:///var/run/docker.sock}
    python-image: ${CODE_SANDBOX_PYTHON_IMAGE:python:3.11-slim}
    memory-limit: ${CODE_SANDBOX_MEMORY_LIMIT:268435456}  # 256MB
    cpu-count: ${CODE_SANDBOX_CPU_COUNT:1}
    timeout-seconds: ${CODE_SANDBOX_TIMEOUT:120}
    js-timeout-seconds: ${CODE_SANDBOX_JS_TIMEOUT:10}
    network-disabled: ${CODE_SANDBOX_NETWORK_DISABLED:false}
    venv-cache-dir: ${CODE_SANDBOX_VENV_DIR:${user.home}/.novacloudedu/venvs}
    temp-dir: ${CODE_SANDBOX_TEMP_DIR:${java.io.tmpdir}/novacloudedu-sandbox}

# 日志配置
logging:
  level:
    com.novacloudedu.backend: debug
    org.springframework.data.neo4j.cypher.unrecognized: error

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

