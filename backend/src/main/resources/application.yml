spring:
  application:
    name: backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
# JWT 配置
jwt:
  secret: ${JWT_SECRET:NovaCloudEduSecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.novacloudedu.backend: debug

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# AI 配置 - 阿里云灵积平台 (DashScope)
ai:
  dashscope:
    # API密钥配置 (通过环境变量设置: export DASHSCOPE_API_KEY=your-key)
    api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key-here}
    
    # LLM 模型配置
    llm:
      # 可选模型: qwen-turbo, qwen-plus, qwen-max, qwen-max-longcontext
      model-name: ${DASHSCOPE_LLM_MODEL:qwen-turbo}
      temperature: 0.7
      max-tokens: 2000
      top-p: 0.8
      enable-search: false  # 是否启用联网搜索
    
    # Embedding 模型配置
    embedding:
      # 可选模型: text-embedding-v1, text-embedding-v2
      model-name: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v2}
      dimension: 1536
      text-type: document  # document 或 query
  
  # RAG 配置
  rag:
    enabled: true
    top-k: 5  # 检索Top-K个相关片段
    similarity-threshold: 0.7  # 相似度阈值
    chunk-size: 500  # 文本分块大小
    chunk-overlap: 50  # 分块重叠大小
    max-context-length: 3000  # 最大上下文长度
  
  # 总结配置
  summary:
    cache-enabled: true
    cache-ttl: 7d  # 缓存7天
    default-type: detailed  # brief, detailed, keypoints
  
  # 对话配置
  conversation:
    max-history: 10  # 保留最近10轮对话
    context-window: 4000  # 上下文窗口
  
  # 知识点提取配置
  knowledge:
    max-points: 20  # 每章最多提取20个知识点
    min-confidence: 0.6  # 最小置信度
  
  # 测试题生成配置
  quiz:
    default-count: 5  # 默认生成5道题
    difficulty-distribution:  # 难度分布
      easy: 0.3
      medium: 0.5
      hard: 0.2
