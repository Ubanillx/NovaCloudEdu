# =================================================================
# NovaCloudEdu — 全局共享配置
# 所有敏感值/环境差异值均通过 ${ENV_VAR:default} 注入
# Profile 文件仅覆盖连接地址、日志级别、连接池等少量差异
# =================================================================

spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
  # Docker Compose 由外部管理，禁用 Spring Boot 自动启动
  docker:
    compose:
      enabled: false

  # ---- 数据源（Profile 可覆盖 host） ----
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:novacloudedu}?stringtype=unspecified
    username: ${DB_USERNAME:nova}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  # ---- 数据库增量迁移（Flyway）----
  # backend/sql 仍用于全新 PostgreSQL 数据卷初始化；db/migration 用于已有数据库的结构升级。
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:8}
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ---- Neo4j ----
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_BOLT_PORT:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

  # ---- Elasticsearch ----
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}

  # ---- 邮件 SMTP ----
  mail:
    host: ${MAIL_HOST:smtp.exmail.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.required: true
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
      mail.smtp.socketFactory.port: 465
      mail.smtp.socketFactory.fallback: false
      mail.smtp.timeout: 5000
      mail.smtp.connectiontimeout: 5000

# =================================================================
# 管理员邮件通知
# =================================================================
admin-email:
  enabled: ${ADMIN_EMAIL_ENABLED:true}
  recipients: ${ADMIN_EMAIL_RECIPIENTS:email@ubanillx.cn}
  platform-name: 智云星课

# =================================================================
# IP 归属地查询（MaxMind GeoLite2 City）
# =================================================================
geoip:
  database-path: ${GEOIP_DATABASE_PATH:classpath:geoip/GeoLite2-City.mmdb}

# =================================================================
# JWT
# =================================================================
jwt:
  secret: ${JWT_SECRET:NovaCloudEduSecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}

# =================================================================
# MyBatis-Plus
# =================================================================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.novacloudedu.backend.entity
  type-handlers-package: com.novacloudedu.backend.infrastructure.persistence.handler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# =================================================================
# SMS 短信
# =================================================================
sms:
  url: ${SMS_URL:}
  query-url: ${SMS_QUERY_URL:https://push.spug.cc/request/query}
  token: ${SMS_TOKEN:}
  app-name: ${SMS_APP_NAME:智云星课}
  expire-minutes: ${SMS_EXPIRE_MINUTES:5}

# =================================================================
# 阿里云 OSS
# =================================================================
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:novacloudedu}
    domain: ${ALIYUN_OSS_DOMAIN:}
  # 智能语音交互 (NLS)
  nls:
    access-key-id: ${ALIYUN_NLS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_NLS_ACCESS_KEY_SECRET:}
    app-key: ${ALIYUN_NLS_APP_KEY:}
    url: wss://nls-gateway-cn-shanghai.aliyuncs.com/ws/v1
    asr:
      enable-intermediate-result: true
      enable-punctuation: true
      enable-itn: true
      sample-rate: 16000
      format: pcm
    tts:
      voice: xiaoyun
      volume: 50
      speech-rate: 0
      pitch-rate: 0
      format: pcm
      sample-rate: 16000
    transcriber:
      enable-intermediate-result: true
      enable-punctuation: true
      enable-itn: true
      max-sentence-silence: 800
      sample-rate: 16000
      format: pcm

# =================================================================
# AI 配置
# =================================================================
ai:
  # ---- DashScope 基础 ----
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    llm:
      model-name: ${DASHSCOPE_LLM_MODEL:qwen-max}
      vision-model-name: ${DASHSCOPE_VISION_MODEL:qwen-vl-max}
      temperature: 0.7
      max-tokens: 2000
      top-p: 0.8
      enable-search: false
    embedding:
      model-name: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v2}
      dimension: 1536
      text-type: document
    rerank:
      model-name: ${DASHSCOPE_RERANK_MODEL:gte-rerank}
      enabled: true

  # ---- 对话记忆 ----
  conversation:
    max-history: 10
    context-window: 4000
    window-size: 20
    summarize-threshold: 30

  # ---- 多模型路由（Langchain4j） ----
  chat-models:
    default-model: ${AI_DEFAULT_MODEL:deepseek/deepseek-v4-pro}
    default-vision-model: ${AI_DEFAULT_VISION_MODEL:openrouter/google/gemini-3-flash-preview}
    providers:
      dashscope:
        enabled: true
        api-key: ${DASHSCOPE_API_KEY:}
        models:
          qwen-max:
            type: text
            temperature: 0.7
            max-tokens: 2000
            top-p: 0.8
          qwen-plus:
            type: text
            temperature: 0.7
            max-tokens: 2000
          qwen-turbo:
            type: text
            temperature: 0.7
            max-tokens: 2000
          qwen-long:
            type: text
            temperature: 0.7
            max-tokens: 6000
            top-p: 0.8
          qwen-vl-max:
            type: vision
            temperature: 0.7
            max-tokens: 2000
          qwen-vl-plus:
            type: vision
            temperature: 0.7
            max-tokens: 2000
          qwen3-235b-a22b:
            type: text
            temperature: 0.7
            max-tokens: 8000
            top-p: 0.8
      openai:
        enabled: ${OPENAI_ENABLED:false}
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        models:
          gpt-4o:
            type: vision
            temperature: 0.7
            max-tokens: 4000
          gpt-4o-mini:
            type: vision
            temperature: 0.7
            max-tokens: 2000
      deepseek:
        enabled: ${DEEPSEEK_ENABLED:true}
        api-key: ${DEEPSEEK_API_KEY:}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        models:
          deepseek-chat:
            type: text
            temperature: 0.7
            max-tokens: 4000
          deepseek-reasoner:
            type: text
            temperature: 0.6
            max-tokens: 8000
          deepseek-v4-pro:
            type: text
            temperature: 0.7
            max-tokens: 128000
            top-p: 0.8
      moonshot:
        enabled: ${MOONSHOT_ENABLED:false}
        api-key: ${MOONSHOT_API_KEY:}
        base-url: ${MOONSHOT_BASE_URL:https://api.moonshot.cn/v1}
        models:
          moonshot-v1-128k:
            type: text
            temperature: 0.7
            max-tokens: 4000
          moonshot-v1-32k:
            type: text
            temperature: 0.7
            max-tokens: 4000
      zhipu:
        enabled: ${ZHIPU_ENABLED:false}
        api-key: ${ZHIPU_API_KEY:}
        models:
          glm-4:
            type: text
            temperature: 0.7
            max-tokens: 4000
          glm-4v:
            type: vision
            temperature: 0.7
            max-tokens: 2000
      siliconflow:
        enabled: ${SILICONFLOW_ENABLED:false}
        api-key: ${SILICONFLOW_API_KEY:}
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        models:
          deepseek-ai/DeepSeek-V3:
            type: text
            temperature: 0.7
            max-tokens: 4000
          Qwen/Qwen2.5-72B-Instruct:
            type: text
            temperature: 0.7
            max-tokens: 4000
      ollama:
        enabled: ${OLLAMA_ENABLED:false}
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        models:
          llama3:
            type: text
            temperature: 0.7
          llava:
            type: vision
            temperature: 0.7
      openrouter:
        enabled: ${OPENROUTER_ENABLED:false}
        api-key: ${OPENROUTER_API_KEY:}
        base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
        models:
          openai/gpt-5.2:
            type: text
            temperature: 0.7
            max-tokens: 8000
          openai/gpt-5-nano:
            type: text
            temperature: 0.7
            max-tokens: 4000
          google/gemini-3-flash-preview:
            type: vision
            temperature: 0.7
            max-tokens: 8000
          google/gemini-2.5-flash-preview:
            type: vision
            temperature: 0.7
            max-tokens: 8000
          anthropic/claude-sonnet-4:
            type: text
            temperature: 0.7
            max-tokens: 8000
          openai/gpt-4o:
            type: vision
            temperature: 0.7
            max-tokens: 4000
          openai/gpt-4.1-mini:
            type: text
            temperature: 0.7
            max-tokens: 4000
          deepseek/deepseek-r1:
            type: text
            temperature: 0.6
            max-tokens: 8000
          qwen/qwen3-235b-a22b:
            type: text
            temperature: 0.7
            max-tokens: 8000

  # ---- 文生图 ----
  image-models:
    enabled: true
    default-model: dashscope/wan2.6-t2i
    upload-to-oss: true
    providers:
      dashscope:
        enabled: true
        api-key: ${DASHSCOPE_API_KEY:}
        type: dashscope
        models:
          wan2.6-t2i:
            size: "1280*1280"
            n: 1
            prompt-extend: true
          wanx2.1-t2i-plus:
            size: "1024*1024"
            n: 1
      siliconflow:
        enabled: ${SILICONFLOW_ENABLED:false}
        api-key: ${SILICONFLOW_API_KEY:}
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        type: openai
        models:
          black-forest-labs/FLUX.1-schnell:
            size: "1024*1024"
            steps: 4
            n: 1

  # ---- 文生视频 ----
  video-models:
    enabled: true
    default-model: dashscope/wan2.6-t2v
    upload-to-oss: true
    providers:
      dashscope:
        enabled: true
        api-key: ${DASHSCOPE_API_KEY:}
        type: dashscope
        models:
          wan2.6-t2v:
            size: "1280*720"
            duration: 5
            prompt-extend: true
          wan2.2-t2v-plus:
            size: "832*480"
            duration: 5
            prompt-extend: true

  # ---- RAG ----
  rag:
    enabled: ${RAG_ENABLED:true}
    top-k: 5
    similarity-threshold: 0.7
    chunk-size: 500
    chunk-overlap: 50
    max-context-length: 3000

  # ---- AI 总结 ----
  summary:
    cache-enabled: true
    cache-ttl: 7d
    default-type: detailed

  # ---- 知识点提取 ----
  knowledge:
    max-points: 20
    min-confidence: 0.6

  # ---- 测试题生成 ----
  quiz:
    default-count: 5
    difficulty-distribution:
      easy: 0.3
      medium: 0.5
      hard: 0.2

# =================================================================
# 百度 OCR
# =================================================================
baidu:
  ocr:
    app-id: ${BAIDU_OCR_APP_ID:}
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}
    api-type: ${BAIDU_OCR_API_TYPE:accurate}

# =================================================================
# 书籍内容加密
# =================================================================
book:
  content:
    encryption:
      enabled: ${BOOK_ENCRYPTION_ENABLED:false}
      secret-key: ${BOOK_ENCRYPTION_KEY:NovaCloudEduBookKey1}

# =================================================================
# Tavily Search API（PPT Agent 联网搜索）
# =================================================================
tavily:
  api-key: "${TAVILY_API_KEY:}"

# =================================================================
# PPT 模板服务
# =================================================================
ppt-service:
  url: ${PPT_SERVICE_URL:http://localhost:8100}

# =================================================================
# PPT Agent 多智能体
# =================================================================
ppt:
  agent:
    planner-model: ${PPT_AGENT_PLANNER_MODEL:openrouter/openai/gpt-5.2}
    content-model: ${PPT_AGENT_CONTENT_MODEL:openrouter/openai/gpt-5.2}
    design-model: ${PPT_AGENT_DESIGN_MODEL:openrouter/google/gemini-3-flash-preview}
    design-tool-model: ${PPT_AGENT_DESIGN_TOOL_MODEL:openrouter/openai/gpt-5-nano}
    evaluator-model: ${PPT_AGENT_EVALUATOR_MODEL:openrouter/openai/gpt-5-nano}
    layout-selector-model: ${PPT_AGENT_LAYOUT_SELECTOR_MODEL:openrouter/openai/gpt-5-nano}
    html-slide-model: ${PPT_AGENT_HTML_SLIDE_MODEL:openrouter/google/gemini-3-flash-preview}
    enable-content-validation: ${PPT_AGENT_CONTENT_VALIDATION:true}
    enable-layout-selection: ${PPT_AGENT_LAYOUT_SELECTION:true}
    enable-per-slide-inspection: ${PPT_AGENT_PER_SLIDE_INSPECTION:true}
    concurrency: ${PPT_AGENT_CONCURRENCY:3}
    quality-threshold: ${PPT_AGENT_QUALITY_THRESHOLD:65}
    max-repair-rounds: ${PPT_AGENT_MAX_REPAIR_ROUNDS:2}
    slide-score-threshold: ${PPT_AGENT_SLIDE_SCORE_THRESHOLD:60}
    image-search:
      enabled: ${PPT_AGENT_IMAGE_SEARCH_ENABLED:false}
      provider: ${PPT_AGENT_IMAGE_SEARCH_PROVIDER:bing}
      api-key: "${PPT_AGENT_IMAGE_SEARCH_API_KEY:}"

# =================================================================
# Typst 试卷排版服务
# =================================================================
typst:
  service:
    url: ${TYPST_SERVICE_URL:http://localhost:8200}

# =================================================================
# OnlyOffice 文档编辑
# =================================================================
onlyoffice:
  document-server-url: ${ONLYOFFICE_URL:http://localhost:9980}
  callback-url: ${ONLYOFFICE_CALLBACK_URL:http://host.docker.internal:8080/api/onlyoffice/callback}
  jwt-secret: "${ONLYOFFICE_JWT_SECRET:}"

# =================================================================
# 代码执行沙箱
# =================================================================
workflow:
  code-sandbox:
    docker-enabled: ${CODE_SANDBOX_DOCKER_ENABLED:true}
    docker-host: ${CODE_SANDBOX_DOCKER_HOST:unix:///var/run/docker.sock}
    python-image: ${CODE_SANDBOX_PYTHON_IMAGE:python:3.11-slim}
    memory-limit: ${CODE_SANDBOX_MEMORY_LIMIT:268435456}
    cpu-count: ${CODE_SANDBOX_CPU_COUNT:1}
    timeout-seconds: ${CODE_SANDBOX_TIMEOUT:120}
    js-timeout-seconds: ${CODE_SANDBOX_JS_TIMEOUT:10}
    network-disabled: ${CODE_SANDBOX_NETWORK_DISABLED:false}
    venv-cache-dir: ${CODE_SANDBOX_VENV_DIR:${user.home}/.novacloudedu/venvs}
    temp-dir: ${CODE_SANDBOX_TEMP_DIR:${java.io.tmpdir}/novacloudedu-sandbox}

# =================================================================
# SRS 直播媒体服务器
# =================================================================
srs:
  rtmp-url: ${SRS_RTMP_URL:rtmp://localhost:1935/live}
  http-base: ${SRS_HTTP_BASE:http://localhost:8085}

# =================================================================
# 服务器 / 视频转码
# =================================================================
server:
  base-url: ${SERVER_BASE_URL:http://localhost:8080}

video:
  hls:
    proxy-segments: ${VIDEO_HLS_PROXY_SEGMENTS:false}
  transcode:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    hls-time: ${HLS_TIME:10}

# =================================================================
# ES 全文搜索
# =================================================================
search:
  elasticsearch:
    enabled: ${ES_SEARCH_ENABLED:true}
    book-index: nova_books
    chapter-index: nova_chapters
    post-index: nova_posts
    highlight-pre-tag: "<em class=\"search-highlight\">"
    highlight-post-tag: "</em>"
    max-result-window: 10000
    suggest-size: 10
    fragment-size: 150
    number-of-fragments: 3

# =================================================================
# 日志（Profile 可覆盖级别）
# =================================================================
logging:
  level:
    com.novacloudedu.backend: ${LOG_LEVEL:debug}
    org.springframework.data.neo4j.cypher.unrecognized: error

# =================================================================
# SpringDoc OpenAPI
# =================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
